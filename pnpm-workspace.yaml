# 将本目录声明为独立 pnpm 工作区根
# （避免被上级目录 C:\Users\a3129\pnpm-workspace.yaml 识别为工作区成员，
#   确保 node_modules 与 lockfile 落在项目内，Vercel 构建亦自洽）
packages:
  - "."

# 允许执行构建脚本的依赖（原生模块：better-sqlite3 需预编译二进制，esbuild 需平台二进制）
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
allowBuilds:
  better-sqlite3: true
  esbuild: true

# 强制所有包引用同一 version 的 unified（避免 11.0.0 / 11.0.5 两个副本导致类型不兼容）
overrides:
  unified: 11.0.5
  # hast-util-to-estree（MDX evaluate 路径）依赖 style-to-js；
  # 1.0.0 为纯 CJS 且用 exports["default"] 括号赋值，Vite interop 识别失败
  # （报 styleToJs is not a function）。KaTeX 输出带 style 属性时触发，升级到 1.1.x（双 ESM/CJS）。
  style-to-js: ^1.1.21
  # 强制全仓统一 katex 0.18.5（根依赖与 rehype-katex/remark-math/simple-mind-map 捆绑的 0.16.47）。
  # 背景：katex 0.18 起内部类名改为 katex- 前缀（base→katex-base、strut→katex-strut 等），
  # 0.18 的 CSS 不再包含旧无前缀类。若服务端 rehype-katex 用 0.16.47 生成旧类名 HTML、
  # 页面却加载 0.18.5 CSS，覆盖定位（如 \neq 的 \not= 斜线叠加层 rlap/inner）全部失效，
  # 不等号平铺渲染成 "/="（编辑器直用根依赖 0.18.5 故正常——「编辑正常、阅读 /=」根因）。
  katex: 0.18.5
