plugins { id 'com.android.application' }
android {
    namespace 'com.byqx.blog'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.byqx.blog'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.1.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    signingConfigs {
        localRelease {
            storeFile file('../signing/byqx.jks')
            storePassword System.getenv('BYQX_ANDROID_STORE_PASSWORD')
            keyAlias 'byqx'
            keyPassword System.getenv('BYQX_ANDROID_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.localRelease; minifyEnabled false } }
    externalNativeBuild { cmake { path file('CMakeLists.txt'); version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
