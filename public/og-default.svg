<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="个人知识库">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141413"/>
      <stop offset="1" stop-color="#241f1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3542d"/>
      <stop offset="1" stop-color="#d98b52"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 像素网格装饰 -->
  <g fill="#ffffff" opacity="0.05">
    <rect x="80" y="80" width="6" height="6"/>
    <rect x="104" y="80" width="6" height="6"/>
    <rect x="80" y="104" width="6" height="6"/>
    <rect x="1112" y="520" width="6" height="6"/>
    <rect x="1088" y="520" width="6" height="6"/>
    <rect x="1112" y="544" width="6" height="6"/>
  </g>

  <!-- 左侧强调条 -->
  <rect x="88" y="196" width="8" height="120" rx="4" fill="url(#accent)"/>

  <!-- 英文小标 -->
  <text x="128" y="228" font-family="monospace, 'Courier New', monospace" font-size="26" letter-spacing="8"
        fill="#b3542d" text-anchor="start">PERSONAL KNOWLEDGE BASE</text>

  <!-- 主标题 -->
  <text x="128" y="316" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="76" font-weight="700" fill="#f5f2ee" text-anchor="start">白衣卿相</text>

  <!-- 副标题 -->
  <text x="130" y="378" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="30" fill="#a8a29c" text-anchor="start">技术教程 · 学习笔记 · 随笔与摄影</text>

  <!-- 底部像素分割线 -->
  <g fill="url(#accent)">
    <rect x="128" y="452" width="18" height="18" rx="2"/>
    <rect x="158" y="452" width="18" height="18" rx="2" opacity="0.75"/>
    <rect x="188" y="452" width="18" height="18" rx="2" opacity="0.5"/>
    <rect x="218" y="452" width="18" height="18" rx="2" opacity="0.3"/>
  </g>

  <!-- 右下角徽标 -->
  <text x="1112" y="566" font-family="monospace, 'Courier New', monospace" font-size="24"
        fill="#6b6560" text-anchor="end">Powered by Astro</text>
</svg>
